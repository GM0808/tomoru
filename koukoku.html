<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電子公告｜株式会社TOMORU</title>
<meta name="description" content="株式会社TOMORUの電子公告ページです。会社法に基づく公告を掲載します。">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-deep:   #141b33;
    --amber:      #f5a623;
    --glow:       #ffd28a;
    --horizon:    #c96f4a;
    --cream:      #faf6ee;
    --ink:        #33302a;
    --ink-soft:   #6b6659;
    --line:       #e2d9c6;
    font-size: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Noto Sans JP', "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.9;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  h1 { font-family:'Zen Old Mincho', "Hiragino Mincho ProN", "Yu Mincho", serif; }

  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:1rem 1.6rem;
    background:var(--sky-deep);
  }
  .brand {
    font-family:'Zen Old Mincho', serif;
    color:#fff; font-size:1.05rem; letter-spacing:.12em;
    text-decoration:none; display:flex; align-items:center; gap:.5rem;
  }
  .brand .flame { width:14px; height:18px; }
  .back {
    color:rgba(255,255,255,.85); text-decoration:none;
    font-size:.82rem; letter-spacing:.14em;
  }
  .back:hover { color:var(--glow); }

  main { flex:1; padding:4.5rem 1.5rem; }
  .container { max-width:760px; margin:0 auto; }
  .sec-label {
    display:block; text-align:center;
    color:var(--horizon); font-size:.75rem; letter-spacing:.4em; font-weight:500;
    margin-bottom:.9rem;
  }
  .sec-title {
    text-align:center; font-size:clamp(1.5rem, 3.6vw, 2rem);
    letter-spacing:.18em; font-weight:600; margin-bottom:2.6rem;
  }
  .sec-title::after {
    content:""; display:block; width:44px; height:2px; margin:1.2rem auto 0;
    background:linear-gradient(to right, var(--amber), var(--horizon));
    border-radius:2px;
  }
  .notice-box {
    background:#fff; border-radius:14px; padding:2.4rem 2rem;
    box-shadow:0 6px 24px rgba(51,48,42,.07);
    border-top:3px solid var(--amber);
  }
  .notice-box p.intro {
    font-size:.92rem; color:var(--ink-soft); margin-bottom:2rem;
  }
  .notice-list { list-style:none; }
  .notice-empty {
    text-align:center; color:var(--ink-soft); font-size:.95rem;
    padding:2.2rem 0;
    border:1px dashed var(--line); border-radius:10px;
  }

  footer {
    background:var(--sky-deep); color:rgba(255,255,255,.75);
    text-align:center; padding:2.4rem 1.5rem 2rem; font-size:.85rem;
  }
  footer .copy { font-size:.72rem; letter-spacing:.12em; color:rgba(255,255,255,.45); margin-top:1rem; }
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <svg class="flame" viewBox="0 0 20 26" aria-hidden="true"><path d="M10 0C10 6 3 8.5 3 15a7 7 0 0 0 14 0C17 8.5 10 6 10 0Z" fill="#f5a623"/><path d="M10 9c0 3.4-3.4 4.6-3.4 8a3.4 3.4 0 0 0 6.8 0C13.4 13.6 10 12.4 10 9Z" fill="#ffd28a"/></svg>
    株式会社TOMORU
  </a>
  <a class="back" href="index.html">トップページへ</a>
</header>

<main>
  <div class="container">
    <span class="sec-label">PUBLIC NOTICE</span>
    <h1 class="sec-title">電子公告</h1>
    <div class="notice-box">
      <p class="intro">
        株式会社TOMORUの公告は、当ページに掲載する方法により行います（会社法に基づく決算公告その他の公告）。
      </p>
      <ul class="notice-list">
        <li class="notice-empty">現在、掲載中の公告はありません。</li>
      </ul>
    </div>
  </div>
</main>

<footer>
  <div>株式会社TOMORU　東京都世田谷区八幡山3丁目9番7号</div>
  <p class="copy">&copy; 2026 TOMORU Inc. All Rights Reserved.</p>
</footer>

</body>
</html>
